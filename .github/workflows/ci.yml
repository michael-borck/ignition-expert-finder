name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

  publish:
    # Only after tests pass, and never from a pull request - a fork must not be
    # able to push an image to the registry.
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # Needed to build the arm64 image on an x86 runner.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Both, so `docker compose pull` works whatever the server turns out
          # to be. arm64 is emulated on the x86 runner and roughly doubles the
          # build; drop it if the deployment target is settled as x86.
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Confirm the image carries no personal data
        # The image holds code and configuration; the bench is uploaded by an
        # organiser after deployment. If a future change starts baking it in,
        # fail loudly rather than quietly publishing 35 people's contact
        # details and photographs to a registry.
        run: |
          image="ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}"
          contents=$(docker run --rm --entrypoint sh "$image" -c "ls -R /app/data")
          echo "$contents"
          if echo "$contents" | grep -qE 'clinicians\.json|\.jpg|\.jpeg|\.png'; then
            echo "::error::personal data found in the published image"
            exit 1
          fi
          echo "confirmed: no personal data in the image"
